<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script src="./ds-base.js"></script>
</helmet>
<div style="position: fixed; bottom: 24px; right: 24px; z-index: 50; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; align-items: flex-end; gap: 12px;">
  <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}">
    <div style="width: 340px; max-width: calc(100vw - 48px); background: #fff; border: 1px solid #E2E8F0; border-radius: 14px; box-shadow: 0 12px 32px rgba(11,37,69,0.22); overflow: hidden; display: flex; flex-direction: column;">
      <div style="background: linear-gradient(160deg, #0B2545 0%, #13315C 100%); padding: 16px 18px; display: flex; align-items: center; justify-content: space-between;">
        <div>
          <div style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px; color: #fff;">Ask PSG</div>
          <div style="font-size: 12px; color: #8FA2C4; margin-top: 2px;">NAICS, compliance, sourcing &mdash; answered instantly</div>
        </div>
        <button onClick="{{ onToggle }}" aria-label="Close" style="background: none; border: none; color: #8FA2C4; font-size: 20px; line-height: 1; cursor: pointer; padding: 4px;" style-hover="color: #fff;">&times;</button>
      </div>
      <div style="max-height: 320px; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; background: #F8FAFC;">
        <sc-if value="{{ showChips }}" hint-placeholder-val="{{ true }}">
          <div style="font-size: 13px; color: #64748B; margin-bottom: 2px;">Try one:</div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
              <button onClick="{{ c.onClick }}" style="font-size: 12.5px; font-weight: 600; color: #0066CC; background: rgba(0,102,204,0.08); border: 1px solid rgba(0,102,204,0.25); border-radius: 999px; padding: 6px 12px; cursor: pointer;" style-hover="background: rgba(0,102,204,0.14);">{{ c.label }}</button>
            </sc-for>
          </div>
        </sc-if>
        <sc-for list="{{ messages }}" as="m" hint-placeholder-count="0">
          <div style="{{ m.wrapStyle }}">
            <div style="{{ m.bubbleStyle }}">{{ m.text }}</div>
          </div>
        </sc-for>
        <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 13px; color: #64748B; font-style: italic;">Thinking&hellip;</div>
        </sc-if>
      </div>
      <form onSubmit="{{ onSubmit }}" style="display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid #E2E8F0; background: #fff;">
        <input value="{{ input }}" onChange="{{ onInputChange }}" placeholder="Ask about NAICS, compliance, sourcing..." style="flex: 1; font-size: 14px; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 8px; outline: none;" style-focus="border-color: #0066CC; box-shadow: 0 0 0 3px rgba(0,102,204,0.3);"></input>
        <button type="submit" disabled="{{ sendDisabled }}" style="background: #0066CC; color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-size: 14px; font-weight: 600; cursor: pointer;" style-hover="filter: brightness(0.92);">Send</button>
      </form>
    </div>
  </sc-if>
  <button onClick="{{ onToggle }}" aria-label="Ask PSG" style="width: 58px; height: 58px; border-radius: 999px; background: #0B2545; border: 2px solid #C9A227; color: #fff; font-size: 22px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 18px rgba(11,37,69,0.35); display: flex; align-items: center; justify-content: center; font-family: 'Archivo', sans-serif;" style-hover="filter: brightness(1.15);">{{ fabGlyph }}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PRESETS = [
  'What NAICS codes are you registered under?',
  'Which distributors do you source from?',
  'What compliance do you verify (TAA/BAA, Section 889)?',
  'How fast do quotes come back?',
];

class Component extends DCLogic {
  state = { open: false, messages: [], input: '', loading: false };

  async ask(question) {
    this.setState(s => ({ messages: [...s.messages, { role: 'user', text: question }], loading: true, input: '' }));
    try {
      const res = await fetch('/.netlify/functions/ask-psg', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      const answer = data.answer || data.error || "Couldn't reach the assistant. Call (970) 396-9855 or use Request a quote.";
      this.setState(s => ({ messages: [...s.messages, { role: 'assistant', text: answer }], loading: false }));
    } catch (e) {
      this.setState(s => ({ messages: [...s.messages, { role: 'assistant', text: "Couldn't reach the assistant. Call (970) 396-9855 or use Request a quote." }], loading: false }));
    }
  }

  renderVals() {
    const { open, messages, input, loading } = this.state;
    return {
      isOpen: open,
      fabGlyph: open ? '' : '?',
      onToggle: () => this.setState(s => ({ open: !s.open })),
      showChips: messages.length === 0,
      chips: PRESETS.map(p => ({ label: p, onClick: () => this.ask(p) })),
      messages: messages.map(m => ({
        text: m.text,
        wrapStyle: `display:flex;justify-content:${m.role === 'user' ? 'flex-end' : 'flex-start'};`,
        bubbleStyle: `max-width:85%;font-size:13.5px;line-height:1.5;padding:9px 13px;border-radius:12px;${m.role === 'user' ? 'background:#0066CC;color:#fff;' : 'background:#fff;color:#334155;border:1px solid #E2E8F0;'}`,
      })),
      loading,
      input,
      onInputChange: (e) => this.setState({ input: e.target.value }),
      sendDisabled: !input.trim() || loading,
      onSubmit: (e) => {
        e.preventDefault();
        if (input.trim() && !loading) this.ask(input.trim());
      },
    };
  }
}
</script>
</body>
</html>
