<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Form detection</title></head>
<body>
<!-- Static, non-JS copy so Netlify's build-time form parser can detect the RFQ form (the live page renders it client-side). Never linked/visited by users. -->
<form name="rfq" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="rfq" />
  <input name="bot-field" />
  <input name="name" /><input name="org" /><input type="email" name="email" /><input name="phone" />
  <input name="mechanism" /><input name="needed_by" /><input name="category" /><textarea name="details"></textarea>
</form>
</body></html>
